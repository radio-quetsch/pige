name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '33 3 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [recorder, purger]
    steps:
      - name: Get branch
        run: |
          echo "GIT_BRANCH=${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - name: Crop SHA
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Set version tags from git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_MINOR=$(echo ${VERSION} | cut -d. -f1-2)" >> $GITHUB_ENV
          echo "VERSION_MAJOR=$(echo ${VERSION} | cut -d. -f1)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (branch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/radio-quetsch/pige-${{ matrix.target }}:${{ env.SHORT_SHA }}
            ghcr.io/radio-quetsch/pige-${{ matrix.target }}:${{ env.GIT_BRANCH }}

      - name: Build and push (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/radio-quetsch/pige-${{ matrix.target }}:${{ env.VERSION }}
            ghcr.io/radio-quetsch/pige-${{ matrix.target }}:${{ env.VERSION_MINOR }}
            ghcr.io/radio-quetsch/pige-${{ matrix.target }}:${{ env.VERSION_MAJOR }}
            ghcr.io/radio-quetsch/pige-${{ matrix.target }}:latest
